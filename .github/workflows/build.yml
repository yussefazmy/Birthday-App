name: Build Birthday App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Source Code
        run: |
          mkdir -p app/src/main/java/com/example/birthdayreminder/data
          mkdir -p app/src/main/java/com/example/birthdayreminder/ui
          mkdir -p app/src/main/java/com/example/birthdayreminder/work
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BirthdayReminder"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.devtools.ksp") version "1.9.22-1.0.17" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.example.birthdayreminder"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.birthdayreminder"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")

              implementation("androidx.work:work-runtime-ktx:2.9.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:name=".BirthdayApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.BirthdayReminder">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">أعياد الميلاد</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.BirthdayReminder" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/birthdayreminder/data/Birthday.kt
          package com.example.birthdayreminder.data

          import androidx.room.Entity
          import androidx.room.PrimaryKey

          @Entity(tableName = "birthdays")
          data class Birthday(
              @PrimaryKey(autoGenerate = true) val id: Int = 0,
              val name: String,
              val day: Int,
              val month: Int,
              val year: Int = 0
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/example/birthdayreminder/data/BirthdayDao.kt
          package com.example.birthdayreminder.data

          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          @Dao
          interface BirthdayDao {
              @Query("SELECT * FROM birthdays")
              fun getAll(): Flow<List<Birthday>>

              @Query("SELECT * FROM birthdays")
              suspend fun getAllOnce(): List<Birthday>

              @Insert suspend fun insert(b: Birthday): Long
              @Update suspend fun update(b: Birthday)
              @Delete suspend fun delete(b: Birthday)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/birthdayreminder/data/AppDatabase.kt
          package com.example.birthdayreminder.data

          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase

          @Database(entities = [Birthday::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun birthdayDao(): BirthdayDao

              companion object {
                  @Volatile private var INSTANCE: AppDatabase? = null
                  fun getInstance(context: Context): AppDatabase =
                      INSTANCE ?: synchronized(this) {
                          INSTANCE ?: Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "birthday_db"
                          ).build().also { INSTANCE = it }
                      }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/birthdayreminder/ui/BirthdayViewModel.kt
          package com.example.birthdayreminder.ui

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.example.birthdayreminder.data.AppDatabase
          import com.example.birthdayreminder.data.Birthday
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          import java.time.LocalDate
          import java.time.temporal.ChronoUnit

          class BirthdayViewModel(app: Application) : AndroidViewModel(app) {
              private val dao = AppDatabase.getInstance(app).birthdayDao()

              val birthdays: StateFlow<List<Birthday>> = dao.getAll()
                  .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())

              fun add(name: String, day: Int, month: Int, year: Int) = viewModelScope.launch {
                  dao.insert(Birthday(name = name, day = day, month = month, year = year))
              }
              fun update(b: Birthday) = viewModelScope.launch { dao.update(b) }
              fun delete(b: Birthday) = viewModelScope.launch { dao.delete(b) }
          }

          private fun safeDate(year: Int, month: Int, day: Int): LocalDate =
              try { LocalDate.of(year, month, day) }
              catch (e: Exception) { LocalDate.of(year, month, 28) }

          fun Birthday.daysUntilNext(): Long {
              val today = LocalDate.now()
              var next = safeDate(today.year, month, day)
              if (next.isBefore(today)) next = safeDate(today.year + 1, month, day)
              return ChronoUnit.DAYS.between(today, next)
          }

          fun Birthday.nextAge(): Int? {
              if (year <= 0) return null
              val today = LocalDate.now()
              var next = safeDate(today.year, month, day)
              if (next.isBefore(today)) next = safeDate(today.year + 1, month, day)
              return next.year - year
          }

          fun daysText(days: Long): String = when {
              days == 0L -> "🎉 عيد ميلاده اليوم!"
              days == 1L -> "غداً"
              days == 2L -> "بعد يومين"
              days in 3..10 -> "بعد $days أيام"
              else -> "بعد $days يوماً"
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/birthdayreminder/work/BirthdayWorker.kt
          package com.example.birthdayreminder.work

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import androidx.core.app.NotificationCompat
          import androidx.work.*
          import com.example.birthdayreminder.MainActivity
          import com.example.birthdayreminder.data.AppDatabase
          import java.time.LocalDate
          import java.util.Calendar
          import java.util.concurrent.TimeUnit

          class BirthdayWorker(ctx: Context, params: WorkerParameters) : CoroutineWorker(ctx, params) {
              override suspend fun doWork(): Result {
                  val dao = AppDatabase.getInstance(applicationContext).birthdayDao()
                  val today = LocalDate.now()
                  val names = dao.getAllOnce()
                      .filter { it.day == today.dayOfMonth && it.month == today.monthValue }
                      .map { it.name }

                  if (names.isNotEmpty()) showNotification(names)
                  return Result.success()
              }

              private fun showNotification(names: List<String>) {
                  val nm = applicationContext
                      .getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val chId = "birthday_channel"

                  val ch = NotificationChannel(chId, "تذكير أعياد الميلاد", NotificationManager.IMPORTANCE_HIGH)
                  nm.createNotificationChannel(ch)

                  val intent = Intent(applicationContext, MainActivity::class.java)
                  val pi = PendingIntent.getActivity(
                      applicationContext, 0, intent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  val title = if (names.size == 1) "🎂 اليوم عيد ميلاد ${names[0]}"
                              else "🎂 اليوم ${names.size} أعياد ميلاد"
                  val body = names.joinToString("، ")

                  val notif = NotificationCompat.Builder(applicationContext, chId)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()

                  nm.notify(1, notif)
              }
          }

          fun scheduleBirthdayCheck(context: Context) {
              val now = Calendar.getInstance()
              val target = Calendar.getInstance().apply {
                  set(Calendar.HOUR_OF_DAY, 9)
                  set(Calendar.MINUTE, 0)
                  set(Calendar.SECOND, 0)
                  if (before(now)) add(Calendar.DAY_OF_YEAR, 1)
              }
              val delay = target.timeInMillis - now.timeInMillis

              val req = PeriodicWorkRequestBuilder<BirthdayWorker>(1, TimeUnit.DAYS)
                  .setInitialDelay(delay, TimeUnit.MILLISECONDS)
                  .build()

              WorkManager.getInstance(context).enqueueUniquePeriodicWork(
                  "birthday_daily_check",
                  ExistingPeriodicWorkPolicy.UPDATE,
                  req
              )
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/birthdayreminder/BirthdayApp.kt
          package com.example.birthdayreminder

          import android.app.Application
          import com.example.birthdayreminder.work.scheduleBirthdayCheck

          class BirthdayApp : Application() {
              override fun onCreate() {
                  super.onCreate()
                  scheduleBirthdayCheck(this)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/birthdayreminder/MainActivity.kt
          package com.example.birthdayreminder

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import com.example.birthdayreminder.ui.BirthdayApp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent { BirthdayApp() }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/birthdayreminder/ui/BirthdayScreen.kt
          package com.example.birthdayreminder.ui

          import android.Manifest
          import android.os.Build
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Delete
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.example.birthdayreminder.data.Birthday
          import java.time.LocalDate

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun BirthdayApp() {
              val dark = isSystemInDarkTheme()
              MaterialTheme(colorScheme = if (dark) darkColorScheme() else lightColorScheme()) {
                  Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                      BirthdayScreen()
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun BirthdayScreen(vm: BirthdayViewModel = viewModel()) {
              val launcher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) {}
              LaunchedEffect(Unit) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      launcher.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }
              }

              val birthdays by vm.birthdays.collectAsState()
              val sorted = remember(birthdays) { birthdays.sortedBy { it.daysUntilNext() } }

              var showDialog by remember { mutableStateOf(false) }
              var editing by remember { mutableStateOf<Birthday?>(null) }

              Scaffold(
                  topBar = {
                      TopAppBar(title = { Text("🎂 أعياد الميلاد") })
                  },
                  floatingActionButton = {
                      FloatingActionButton(onClick = { editing = null; showDialog = true }) {
                          Icon(Icons.Default.Add, contentDescription = "إضافة")
                      }
                  }
              ) { padding ->
                  if (sorted.isEmpty()) {
                      Box(Modifier.fillMaxSize().padding(padding), contentAlignment = Alignment.Center) {
                          Text(
                              "لا يوجد أعياد ميلاد بعد\nاضغط على + لإضافة شخص",
                              textAlign = TextAlign.Center,
                              style = MaterialTheme.typography.bodyLarge
                          )
                      }
                  } else {
                      LazyColumn(
                          Modifier.fillMaxSize().padding(padding),
                          contentPadding = PaddingValues(vertical = 8.dp)
                      ) {
                          items(sorted, key = { it.id }) { b ->
                              BirthdayItem(
                                  b = b,
                                  onClick = { editing = b; showDialog = true },
                                  onDelete = { vm.delete(b) }
                              )
                          }
                      }
                  }
              }

              if (showDialog) {
                  AddEditDialog(
                      existing = editing,
                      onDismiss = { showDialog = false },
                      onSave = { name, d, m, y ->
                          if (editing == null) vm.add(name, d, m, y)
                          else vm.update(editing!!.copy(name = name, day = d, month = m, year = y))
                          showDialog = false
                      }
                  )
              }
          }

          @Composable
          private fun BirthdayItem(b: Birthday, onClick: () -> Unit, onDelete: () -> Unit) {
              val days = b.daysUntilNext()
              val age = b.nextAge()
              val dateText = "${b.day}/${b.month}" + if (b.year > 0) "/${b.year}" else ""

              Card(
                  onClick = onClick,
                  modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 4.dp)
              ) {
                  Row(
                      Modifier.padding(16.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(Modifier.weight(1f)) {
                          Text(b.name, style = MaterialTheme.typography.titleMedium)
                          Spacer(Modifier.height(4.dp))
                          Text(daysText(days), style = MaterialTheme.typography.bodyMedium)
                          Text(
                              dateText + (age?.let { "  •  يكمل $it سنة" } ?: ""),
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                      IconButton(onClick = onDelete) {
                          Icon(Icons.Default.Delete, contentDescription = "حذف")
                      }
                  }
              }
          }

          @Composable
          private fun AddEditDialog(
              existing: Birthday?,
              onDismiss: () -> Unit,
              onSave: (String, Int, Int, Int) -> Unit
          ) {
              var name by remember { mutableStateOf(existing?.name ?: "") }
              var day by remember { mutableStateOf(existing?.day?.toString() ?: "") }
              var month by remember { mutableStateOf(existing?.month?.toString() ?: "") }
              var year by remember { mutableStateOf(if ((existing?.year ?: 0) > 0) existing!!.year.toString() else "") }
              var error by remember { mutableStateOf("") }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(if (existing == null) "إضافة عيد ميلاد" else "تعديل عيد ميلاد") },
                  text = {
                      Column(Modifier.verticalScroll(rememberScrollState())) {
                          OutlinedTextField(
                              value = name,
                              onValueChange = { name = it },
                              label = { Text("الاسم") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )
                          Spacer(Modifier.height(8.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(
                                  value = day,
                                  onValueChange = { day = it.filter(Char::isDigit).take(2) },
                                  label = { Text("اليوم") },
                                  singleLine = true,
                                  modifier = Modifier.weight(1f)
                              )
                              OutlinedTextField(
                                  value = month,
                                  onValueChange = { month = it.filter(Char::isDigit).take(2) },
                                  label = { Text("الشهر") },
                                  singleLine = true,
                                  modifier = Modifier.weight(1f)
                              )
                          }
                          Spacer(Modifier.height(8.dp))
                          OutlinedTextField(
                              value = year,
                              onValueChange = { year = it.filter(Char::isDigit).take(4) },
                              label = { Text("السنة (اختياري)") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )
                          if (error.isNotEmpty()) {
                              Spacer(Modifier.height(8.dp))
                              Text(error, color = MaterialTheme.colorScheme.error)
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = {
                          val d = day.toIntOrNull()
                          val m = month.toIntOrNull()
                          val y = year.toIntOrNull() ?: 0
                          val validDate = try {
                              LocalDate.of(if (y > 0) y else 2000, m ?: 0, d ?: 0); true
                          } catch (e: Exception) { false }

                          if (name.isBlank() || d == null || m == null || !validDate) {
                              error = "تأكد من الاسم والتاريخ الصحيح"
                          } else {
                              onSave(name.trim(), d, m, y)
                          }
                      }) { Text("حفظ") }
                  },
                  dismissButton = { TextButton(onClick = onDismiss) { Text("إلغاء") } }
              )
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BirthdayApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
